name: Release

# Push a tag like v0.9.0 to build and publish a release. The tag must match
# the workspace version in Cargo.toml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.9.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    # The oldest supported runner: its glibc is what the binary needs at
    # least, so building here runs on the most systems.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Version
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libvulkan-dev libasound2-dev libssl-dev libzstd-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo xtask test

      - name: Build
        run: cargo build --release --locked -p disktree-app

      - name: Package
        id: package
        run: |
          name="disktree-${{ steps.version.outputs.version }}-x86_64-linux"
          mkdir -p "dist/$name"
          cp target/release/disktree "dist/$name/"
          strip "dist/$name/disktree"
          cp packaging/install.sh packaging/disktree.desktop.in \
             assets/disktree.svg README.md LICENSE "dist/$name/"
          echo "${{ steps.version.outputs.version }}" > "dist/$name/VERSION"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "archive=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
          else
            gh release create "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" \
              --title "disktree ${TAG#v}" --generate-notes
          fi

  macos:
    name: Build and publish macOS (${{ matrix.arch }})
    # Linux creates the release; these jobs only attach their own archives.
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      CARGO_BUILD_FLAGS: --locked
      # Ad-hoc signing requires no Apple credentials or notarization.
      CODESIGN_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.commit }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo xtask test

      - name: Build
        run: make bundle

      - name: Package
        id: package
        env:
          VERSION: ${{ needs.release.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          name="disktree-$VERSION-$ARCH-macos"
          codesign --verify --deep --strict target/release/Disktree.app
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            target/release/Disktree.app "dist/$name.zip"
          (cd dist && shasum -a 256 "$name.zip" > "$name.zip.sha256")
          echo "archive=dist/$name.zip" >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release upload "$TAG" \
            "$ARCHIVE#macOS (ad-hoc signed, not notarized)" \
            "$ARCHIVE.sha256" --clobber
