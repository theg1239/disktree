name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # What GPUI links against: windowing (Wayland, X11), input, fonts,
      # and the Vulkan loader.
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libvulkan-dev libasound2-dev libssl-dev libzstd-dev

      # Pinned: the lint gate denies clippy::all and ::pedantic, and a newer
      # clippy's new lints are a change to make on purpose, not by surprise.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Lint
        run: cargo xtask lint

      - name: Test
        run: cargo xtask test

      - name: Build macOS app
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: |
          make bundle
          ditto -c -k --sequesterRsrc --keepParent target/release/Disktree.app target/release/Disktree-macOS.zip

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: Disktree-macOS
          path: target/release/Disktree-macOS.zip
