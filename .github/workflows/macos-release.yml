name: macOS Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '12.0'

jobs:
  build:
    name: macOS (${{ matrix.target }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p disktree-app --target "${{ matrix.target }}"
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          packaging/macos/bundle.sh "target/$TARGET/release/disktree" dist/Disktree.app
          ditto -c -k --sequesterRsrc --keepParent dist/Disktree.app "dist/Disktree-$TARGET.zip"
          shasum -a 256 "dist/Disktree-$TARGET.zip" > "dist/Disktree-$TARGET.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Disktree-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.sha256
