[package]
name = "disktree-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native GPUI treemap explorer for disk usage on macOS and Linux"

[[bin]]
name = "disktree"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
gpui-kit = { version = "=0.6.1", default-features = false, features = ["assets"] }
gpui-omarchy = "0.1.2"
disktree-core = { workspace = true }
anyhow = { workspace = true }
rustc-hash = { workspace = true }

[dev-dependencies]
# The window harness: it lets the tests draw a real frame and press real keys.
gpui-kit = { version = "=0.6.1", default-features = false, features = [
    "assets",
    "test-support",
] }
tempfile = "3"
